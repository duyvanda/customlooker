<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Looker Storage Bridge</title>
</head>
<body style="display:none;">
    <script>
        // Storage Bridge chạy trên domain cố định: storage.googleapis.com
        // Đảm bảo localStorage không bao giờ bị mất khi Looker Studio đổi subdomain sandbox sau khi F5!
        window.addEventListener('message', function (event) {
            try {
                var msg = event.data;
                if (!msg || typeof msg !== 'object') return;

                if (msg.action === 'GET_CONFIG') {
                    var val = null;
                    try {
                        var raw = localStorage.getItem(msg.key);
                        if (raw) val = JSON.parse(raw);
                    } catch (e) { }
                    event.source.postMessage({
                        action: 'CONFIG_LOADED',
                        key: msg.key,
                        value: val,
                        reqId: msg.reqId
                    }, '*');
                } else if (msg.action === 'SET_CONFIG') {
                    try {
                        localStorage.setItem(msg.key, JSON.stringify(msg.value));
                    } catch (e) { }
                } else if (msg.action === 'REMOVE_CONFIG') {
                    try {
                        localStorage.removeItem(msg.key);
                    } catch (e) { }
                }
            } catch (err) {
                console.error('[StorageBridge] Error:', err);
            }
        });

        // Thông báo cho parent iframe rằng bridge đã sẵn sàng
        try {
            window.parent.postMessage({ action: 'BRIDGE_READY' }, '*');
        } catch (e) { }
    </script>
</body>
</html>
